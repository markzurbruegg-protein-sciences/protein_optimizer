# E. coli industrial enzyme optimization preset
# Uses Tiers 1–4 (no RFdiffusion by default)
#
# Usage:
#   protein-opt run -i enzyme.fasta --config configs/ecoli_enzyme.yaml

pipeline:
  steps:
    - protein_characterization
    - cysteine_scan
    - motif_scan
    - sequence_complexity
    - find_homologs
    - consensus_design
    - pssm_analysis
    - predict_structure
    - stability_ddg
    - disulfide_design
    - cavity_fill
    - surface_patch
    - e1_score
    - esm1v_score
    - combine_variants

global:
  protected_residues: []  # Set your catalytic residues here, e.g. [45, 89, 120]
  expression_host: ecoli
  output_dir: ./results

# Aggressive cysteine removal for E. coli cytoplasmic expression
protein_characterization:
  expression_host: ecoli
  ph_range: [2.0, 12.0]
  disorder_threshold: 0.5
  signal_peptide_scan_length: 70
  external_tools:
    signalp: auto
    iupred: auto
    hmmscan: auto

cysteine_scan:
  replacement_aas: ["S", "A"]

# Broader homolog search for industrial enzymes
find_homologs:
  database: uniref50
  min_identity: 0.25
  max_identity: 0.95
  max_hits: 1000
  e_value: 1.0e-3

# Lower conservation threshold for more mutation candidates
consensus_design:
  min_conservation: 0.3
  max_mutations: 15

# Use Boltz-2 for structure prediction
predict_structure:
  method: boltz2
  use_msa_server: true

# Scan more positions for stability
stability_ddg:
  method: rosetta
  scan_top_n: 30
  ddg_threshold: -1.0

# E1 with retrieval augmentation for better family-aware scoring
e1_score:
  model: Profluent-Bio/E1-600m
  retrieval_augmented: true
  max_homologs_context: 8
  site_saturation: true
  top_k_positions: 10

# Full 5-model ESM-1v ensemble
esm1v_score:
  n_models: 5
  site_saturation: true
  top_k_positions: 10

# Larger combinatorial library
combine_variants:
  max_single_mutations: 20
  max_combination_order: 3
  max_library_size: 500

scoring:
  weights:
    e1_fitness: 0.25
    esm1v_delta: 0.20
    esmif1_delta: 0.15
    consensus_score: 0.15
    pssm_delta: 0.10
    ddg: 0.10
    cavity_burial: 0.025
    surface_sap: 0.025

  filters:
    max_mutations: 15
    min_plddt: 60.0
    max_ddg: 5.0
    forbid_new_cysteines: true
