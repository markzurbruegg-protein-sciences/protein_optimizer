[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "protein-optimizer"
version = "0.1.0"
description = "Modular protein optimization pipeline for industrial enzyme engineering"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Protein Optimizer Contributors"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "click>=8.0",
    "biopython>=1.80",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "rich>=13.0",
]

[project.optional-dependencies]
tier4 = [
    "torch>=2.0",
    "fair-esm>=2.0",
]
boltz = [
    "boltz",
]
all = [
    "protein-optimizer[tier4,boltz]",
    "matplotlib>=3.7",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]

[project.scripts]
protein-opt = "protein_optimizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
