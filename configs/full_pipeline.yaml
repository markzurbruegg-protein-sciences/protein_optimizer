# Full pipeline configuration for jcDRM protein optimization
# Generate-then-score architecture: all candidate generation first,
# PLM scoring at the end for unbiased evaluation.

pipeline:
  steps:
    # ── Stage 1: Sequence Analysis ──
    - protein_characterization
    - cysteine_scan
    - motif_scan
    - sequence_complexity
    # ── Stage 2: Evolutionary Analysis ──
    - find_homologs
    - consensus_design
    - pssm_analysis
    # ── Stage 3: Structure Prediction & Engineering ──
    - predict_structure
    - stability_ddg
    - disulfide_design
    - cavity_fill
    - surface_patch
    # ── Stage 4: Generative Design & Combination ──
    - rfdiffusion_diversify
    - proteinmpnn_design
    - design_validate
    - combine_variants
    # ── Stage 5: PLM Scoring (final evaluation) ──
    - esm1v_score
    - esmif1_score
    - e1_score

global:
  protected_residues: []
  expression_host: ecoli
  output_dir: ./run_proteins/jcDRM_results

# ──────────────────────────── Tier 1 ────────────────────────────
protein_characterization:
  expression_host: ecoli
  ph_range: [2.0, 12.0]
  disorder_threshold: 0.5
  signal_peptide_scan_length: 70
  external_tools:
    signalp: auto
    iupred: auto
    hmmscan: auto

cysteine_scan:
  replacement_aas: ["S", "A"]

motif_scan:
  check_deamidation: true
  check_oxidation: true
  check_proteolysis: true
  check_hydrophobic_runs: true

sequence_complexity:
  max_homopolymer: 4
  max_proline_run: 3
  window_size: 20
  min_entropy: 2.0

# ──────────────────────────── Tier 2 ────────────────────────────
find_homologs:
  search_method: colabfold
  min_identity: 0.3
  max_identity: 0.9
  max_hits: 500
  e_value: 1.0e-5

consensus_design:
  min_conservation: 0.3
  max_mutations: 20

pssm_analysis:
  pseudocount: 0.5
  threshold: 1.5
  max_mutations: 30

# ──────────────────────────── Tier 3 ────────────────────────────
predict_structure:
  method: boltz2
  conda_env: boltz2-env
  use_msa_server: true

stability_ddg:
  method: thermompnn
  conda_env: protopt
  thermompnn_dir: /home/markzurbruegg/ThermoMPNN
  model_weights: /home/markzurbruegg/ThermoMPNN/models/thermoMPNN_default.pt
  ddg_threshold: -0.5
  saturation_mutagenesis: true
  chain: A

disulfide_design:
  cb_distance_min: 3.5
  cb_distance_max: 4.5
  max_candidates: 15

cavity_fill:
  min_volume: 15.0
  max_mutations: 15

surface_patch:
  sasa_threshold: 0.20
  patch_min_size: 3
  max_mutations: 15

# ──────────────────────────── Tier 4 ────────────────────────────
esm1v_score:
  conda_env: plm
  n_models: 5
  score_existing: true
  site_saturation: false

esmif1_score:
  conda_env: protopt
  chain_id: A

e1_score:
  conda_env: e1
  model: Profluent-Bio/E1-600m
  retrieval_augmented: true
  max_homologs_context: 8
  site_saturation: false
  top_k_positions: 5

rfdiffusion_diversify:
  conda_env: rfd3
  rfdiffusion_dir: /home/markzurbruegg/library-design/rfdiffusion2-lib/RFdiffusion2
  partial_T: 15
  T: 50
  num_designs: 5

proteinmpnn_design:
  conda_env: protopt
  proteinmpnn_dir: /home/markzurbruegg/ProteinMPNN
  use_soluble_model: true
  omit_aas: "C"
  sampling_temp: 0.1
  num_sequences: 8
  redesign_mode: all

design_validate:
  mpnn_conda_env: protopt
  boltz_conda_env: boltz2-env
  min_plddt: 70.0
  max_rmsd: 2.0
  mpnn:
    proteinmpnn_dir: /home/markzurbruegg/ProteinMPNN
    use_soluble_model: true
    omit_aas: "C"
    sampling_temp: 0.1
    num_sequences: 4
  boltz: {}

combine_variants:
  max_single_mutations: 25
  max_combination_order: 3
  max_library_size: 300
  ranking_score: null  # auto-detect best available (ddg, pssm, consensus)
  min_score_threshold: -999.0  # don't filter by score; use ranking instead

# ──────────────────────────── Scoring ────────────────────────────
scoring:
  weights:
    e1_fitness: 0.25
    ddg: 0.20
    consensus_conservation: 0.15
    pssm_log_odds: 0.15
    disulfide_cb_distance: 0.05
    cavity_burial: 0.05
    surface_sap: 0.05
    combo_mean: 0.05
    mpnn_score: 0.05

  filters:
    max_mutations: 15
    forbid_new_cysteines: false   # allow disulfide engineering Cys
    forbid_prolines_in_helix: true
