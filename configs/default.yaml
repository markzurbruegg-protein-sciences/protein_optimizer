# Default protein optimization pipeline configuration
#
# This is the standard pipeline config used when no --config is supplied.
# It runs the full analysis → engineering → SSM → optimization flow.
#
# Usage:
#   protopt -i my_protein.fasta                       # uses this config
#   protopt -i my_protein.fasta -c configs/custom.yaml  # override

pipeline:
  steps:
    # ── Stage 1: Sequence Analysis ──
    - protein_characterization
    - cysteine_scan
    - motif_scan
    - sequence_complexity
    # ── Stage 2: Evolutionary Analysis ──
    - find_homologs
    - consensus_design
    - pssm_analysis
    # ── Stage 3: Structure Prediction & Engineering ──
    - predict_structure
    - stability_ddg
    - disulfide_design
    - cavity_fill
    - surface_patch
    # ── Stage 3b: Solubility SSM ──
    - solubility_ssm
    # ── Stage 4: Variant Combination ──
    - combine_variants
    # ── Stage 5: PLM Scoring ──
    - e1_score
    # ── Stage 6: Multi-Mutation Optimization ──
    - mutation_optimizer

global:
  protected_residues: [204, 312]  # Set your catalytic residues here, e.g. [45, 89, 120]
  expression_host: ecoli
  output_dir: ./results

# ──────────────────────────── Tier 1 ────────────────────────────
protein_characterization:
  expression_host: ecoli
  ph_range: [2.0, 12.0]
  disorder_threshold: 0.5
  signal_peptide_scan_length: 70
  external_tools:
    signalp: auto
    iupred: auto
    hmmscan: auto

cysteine_scan:
  replacement_aas: ["S", "A"]

motif_scan:
  check_deamidation: true
  check_oxidation: true
  check_proteolysis: true
  check_hydrophobic_runs: true

sequence_complexity:
  max_homopolymer: 4
  max_proline_run: 3
  window_size: 20
  min_entropy: 2.0

# ──────────────────────────── Tier 2 ────────────────────────────
find_homologs:
  search_method: colabfold
  min_identity: 0.3
  max_identity: 0.9
  max_hits: 500
  e_value: 1.0e-5

consensus_design:
  min_conservation: 0.3
  max_mutations: 20

pssm_analysis:
  pseudocount: 0.5
  threshold: 1.5
  max_mutations: 30

# ──────────────────────────── Tier 3 ────────────────────────────
predict_structure:
  method: boltz2
  conda_env: boltz2-env
  use_msa_server: true

stability_ddg:
  method: thermompnn
  conda_env: protopt
  thermompnn_dir: /home/markzurbruegg/ThermoMPNN
  model_weights: /home/markzurbruegg/ThermoMPNN/models/thermoMPNN_default.pt
  ddg_threshold: -0.5
  saturation_mutagenesis: true
  chain: A

disulfide_design:
  cb_distance_min: 3.5
  cb_distance_max: 4.5
  max_candidates: 15

cavity_fill:
  min_volume: 15.0
  max_mutations: 15

surface_patch:
  sasa_threshold: 0.20
  patch_min_size: 3
  max_mutations: 15

# ──────────────────────────── Tier 3b ───────────────────────────
solubility_ssm:
  conda_env: protopt
  max_positions: 100
  batch_size: 32

# ──────────────────────────── Tier 4 ────────────────────────────
combine_variants:
  max_single_mutations: 25
  max_combination_order: 3
  max_library_size: 300
  ranking_score: null
  min_score_threshold: -999.0

# ──────────────────────────── Tier 5 ────────────────────────────
e1_score:
  conda_env: e1
  model: Profluent-Bio/E1-600m
  retrieval_augmented: true
  max_homologs_context: 8
  site_saturation: false
  top_k_positions: 20

# ──────────────────────────── Tier 6 ────────────────────────────
mutation_optimizer:
  e1_conda_env: e1
  e1_model: Profluent-Bio/E1-600m
  retrieval_augmented: true
  max_homologs_context: 8
  max_pool_size: 20
  max_combination_order: 5
  max_library_size: 25000
  max_charge_shift: 5

# ──────────────────────────── Scoring ────────────────────────────
scoring:
  weights:
    e1_fitness: 0.30
    ddg: 0.15
    delta_solubility: 0.10
    consensus_conservation: 0.10
    pssm_log_odds: 0.10
    evidence_score: 0.05
    disulfide_cb_distance: 0.05
    cavity_burial: 0.05
    surface_sap: 0.05

  filters:
    max_mutations: 15
    forbid_new_cysteines: false
    forbid_prolines_in_helix: true
