# Full pipeline configuration for jcDRM protein optimization
# Runs all available tiers (1-4) + combine_variants
# Skipped: stability_ddg (no PyRosetta/FoldX), e1_score (model not available),
#           proteinmpnn_design (not installed), esmif1_score (module not available),
#           rfdiffusion_diversify, design_validate, motif_scaffold (Tier 5 deps missing)

pipeline:
  steps:
    # ── Tier 1: Sequence-based heuristics ──
    - cysteine_scan
    - motif_scan
    - sequence_complexity
    # ── Tier 2: Evolutionary analysis ──
    - find_homologs
    - consensus_design
    - pssm_analysis
    # ── Tier 3: Structure-based engineering ──
    - predict_structure
    - disulfide_design
    - cavity_fill
    - surface_patch
    # ── Tier 4: AI/ML scoring ──
    - esm1v_score
    - combine_variants

global:
  protected_residues: []
  expression_host: ecoli
  output_dir: ./run_proteins/jcDRM_results

# ──────────────────────────── Tier 1 ────────────────────────────
cysteine_scan:
  replacement_aas: ["S", "A"]

motif_scan:
  check_deamidation: true
  check_oxidation: true
  check_proteolysis: true
  check_hydrophobic_runs: true

sequence_complexity:
  max_homopolymer: 4
  max_proline_run: 3
  window_size: 20
  min_entropy: 2.0

# ──────────────────────────── Tier 2 ────────────────────────────
find_homologs:
  search_method: colabfold
  min_identity: 0.3
  max_identity: 0.9
  max_hits: 500
  e_value: 1.0e-5

consensus_design:
  min_conservation: 0.4
  max_mutations: 10

pssm_analysis:
  pseudocount: 1
  threshold: 1.0
  max_mutations: 10

# ──────────────────────────── Tier 3 ────────────────────────────
predict_structure:
  method: boltz2
  conda_env: boltz2-env
  use_msa_server: true

disulfide_design:
  cb_distance_min: 3.5
  cb_distance_max: 4.5
  max_candidates: 10

cavity_fill:
  min_volume: 20.0
  max_mutations: 10

surface_patch:
  sasa_threshold: 0.25
  patch_min_size: 3
  max_mutations: 10

# ──────────────────────────── Tier 4 ────────────────────────────
esm1v_score:
  conda_env: plm
  n_models: 5
  score_existing: true
  site_saturation: false

combine_variants:
  max_single_mutations: 20
  max_combination_order: 3
  max_library_size: 200
  min_score_threshold: -999.0  # don't filter by score; use ranking instead

# ──────────────────────────── Scoring ────────────────────────────
scoring:
  weights:
    esm1v_delta: 0.30
    consensus_conservation: 0.20
    pssm_log_odds: 0.20
    disulfide_cb_distance: 0.10
    cavity_burial: 0.10
    surface_sap: 0.05
    combo_mean: 0.05

  filters:
    max_mutations: 15
    forbid_new_cysteines: false   # allow disulfide engineering Cys
    forbid_prolines_in_helix: true
